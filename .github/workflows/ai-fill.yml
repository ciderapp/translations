#############################################################################################
# AI translation fill
#
# Purpose: When locales/en-US.yml changes (because Citadel or Cider-Android
#          just synced its slice of it), run Claude Haiku 5.5 to fill new and
#          changed strings into every other locale.
#
# Shape: a `plan` job lists the locales with work to do (no API calls), then
# one `fill` job per locale translates and pushes that locale on its own, and
# a final `credits` job refreshes the README table and badges.
#   - One job per locale keeps every job short. Android's first fill is about
#     2,000 strings into each of 32 locales; done one after another in a
#     single job, that would outlast the 6-hour job limit.
#   - Each locale is committed as soon as it's done, so a failed or timed-out
#     job loses only its own locale, and the next run picks up exactly what
#     is still stale (i18n/fill-state/, see scripts/lib/fill-state.mjs).
#   - The fill jobs push to main at the same time as each other and as issue
#     applies. scripts/ci/push-with-remerge.sh re-merges a rejected push key
#     by key instead of rebasing, so they never conflict.
#
# Token handling, learned the expensive way:
#   - A GitHub App installation token only lives 1 hour, so it is minted
#     AFTER translation, immediately before the push, never at job start.
#   - The push authenticates with that token explicitly in the remote URL. It
#     does not rely on actions/checkout credential persistence (checkout runs
#     with persist-credentials: false).
#   - Each locale is uploaded as an artifact before the push, so a run's
#     Anthropic spend is recoverable even if the push somehow fails.
#
# History: checkout uses fetch-depth: 0. A locale without a fill-state file is
# seeded from en-US.yml as of the last fill commit, which needs the history.
#
# No recursion: this workflow triggers only on en-US.yml / languages.yml, and
# the files it commits are the *other* locales and i18n/fill-state/.
#
# The daily schedule is a catch-up: it retries batches that failed and ICU
# answers that were rejected, and does nothing (one short plan job) when
# every locale is current.
#
# Required secrets (org-level):
#   ANTHROPIC_API_KEY          - Anthropic API key with Messages API access
#   CIDER_I18N_BOT_APP_ID      - Saki-Yuzishima App identifier
#   CIDER_I18N_BOT_PRIVATE_KEY - PEM contents of the App's private key
#############################################################################################

name: AI fill

on:
  push:
    branches: [main]
    paths:
      - "locales/en-US.yml"
      - "locales/languages.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-translate everything (ignores existing files)"
        type: boolean
        default: false
      lang:
        description: "Limit to one locale (e.g. es). Leave blank for all."
        type: string
        default: ""

# The jobs authenticate with the App token; the default GITHUB_TOKEN is unused.
permissions: {}

concurrency:
  group: ai-fill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Find locales with work to do
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      langs: ${{ steps.pending.outputs.langs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm install --no-package-lock

      - name: List pending locales
        id: pending
        env:
          FORCE_FLAG: ${{ inputs.force }}
          LANG_FILTER: ${{ inputs.lang }}
        run: |
          set -euo pipefail
          args=()
          if [ "${FORCE_FLAG:-false}" = "true" ]; then args+=(--force); fi
          if [ -n "${LANG_FILTER:-}" ]; then args+=(--lang "${LANG_FILTER}"); fi
          langs=$(node scripts/i18n-translate.mjs --list-pending --json "${args[@]}")
          echo "langs=${langs}" >> "$GITHUB_OUTPUT"
          echo "Pending: ${langs}"

  fill:
    name: Translate ${{ matrix.lang }}
    needs: plan
    if: needs.plan.outputs.langs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # Concurrent Anthropic streams. Each job is sequential inside; raise this
      # if the API tier allows, lower it if runs start hitting 429s.
      max-parallel: 8
      matrix:
        lang: ${{ fromJSON(needs.plan.outputs.langs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # main, not the triggering commit: start from everything that has
          # landed, so a run never redoes a locale another run just filled.
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm install --no-package-lock

      - name: Translate ${{ matrix.lang }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_FLAG: ${{ inputs.force }}
          LANG_CODE: ${{ matrix.lang }}
        run: |
          set -euo pipefail
          args=(--lang "${LANG_CODE}")
          if [ "${FORCE_FLAG:-false}" = "true" ]; then args+=(--force); fi
          node scripts/i18n-translate.mjs "${args[@]}"

      # Recovery net: upload the translated files before the push is attempted.
      # If the push fails for any reason, the run's Claude output is still
      # downloadable from the run's Artifacts, so the spend is never lost.
      - name: Upload translated locale (recovery artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locale-${{ matrix.lang }}
          path: |
            locales/${{ matrix.lang }}.yml
            i18n/fill-state/${{ matrix.lang }}.yml
          retention-days: 7
          if-no-files-found: warn

      # Minted HERE, not at job start: a long fill can outlast the 1-hour
      # installation-token lifetime.
      - name: 🪪 Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CIDER_I18N_BOT_APP_ID }}
          private-key: ${{ secrets.CIDER_I18N_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit and push ${{ matrix.lang }}
        env:
          REMOTE: https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git
          LANG_CODE: ${{ matrix.lang }}
        run: |
          set -euo pipefail
          git config user.name  'saki-yuzishima[bot]'
          git config user.email '286499753+saki-yuzishima[bot]@users.noreply.github.com'
          bash scripts/ci/push-with-remerge.sh "chore(i18n): AI fill (${LANG_CODE})" \
            "locales/${LANG_CODE}.yml" "i18n/fill-state/${LANG_CODE}.yml"

  # Refresh credit badges + README table. Mostly a no-op here (AI fills
  # don't add translators), but this is the workflow that fires when
  # languages.yml changes, so it's what keeps the Languages badge honest.
  credits:
    name: Update credits and badges
    needs: [plan, fill]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm install --no-package-lock

      - name: Update credits and badges
        run: node scripts/update-credits.mjs

      - name: 🪪 Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CIDER_I18N_BOT_APP_ID }}
          private-key: ${{ secrets.CIDER_I18N_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit and push
        env:
          REMOTE: https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          git config user.name  'saki-yuzishima[bot]'
          git config user.email '286499753+saki-yuzishima[bot]@users.noreply.github.com'
          bash scripts/ci/push-with-remerge.sh "chore(i18n): update credits" README.md .github/badges/
