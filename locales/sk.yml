mobile.playback.drm.revokedMessage: Apple Music chráni svoje skladby pomocou Widevine, no Widevine tomuto zariadeniu už nedôveruje. Zvyčajne to nastane po zmene softvéru, napríklad po odomknutí bootloadera. Stále môžete prehliadať, vyhľadávať, spravovať knižnicu a čítať texty piesní.
mobile.playback.drm.setupFailedMessage: Pred prvým prehrávaním Apple Music musí toto zariadenie nastaviť Widevine, bezpečnostnú funkciu, ktorá chráni skladby. Nastavenie sa nedokončilo. Skontrolujte pripojenie a skúste to znova.
