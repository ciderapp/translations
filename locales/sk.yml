mobile.playback.drm.unsupportedMessage: Apple Music chráni svoje skladby pomocou Widevine, bezpečnostnej funkcie zabudovanej vo väčšine zariadení s Androidom. Toto zariadenie ju nemá, preto tu skladby nemožno prehrávať. Stále môžete prehliadať, vyhľadávať, spravovať knižnicu a čítať texty piesní.
mobile.playback.explicitOffMessage: Apple Music pre tento Apple účet neprehráva explicitné skladby, preto ich Cider preskakuje. Tento stav vyplýva z obmedzení obsahu účtu, napríklad Čas pred obrazovkou na iPhone, iPade alebo Macu, detského účtu v zdieľaní rodiny alebo overenia veku, ak to vyžaduje vaša krajina. Verzie bez explicitného obsahu sa prehrajú.
