oobe.audio.text: |-
  Cider menghadirkan tumpukan audio yang dirancang dan disetel khusus untuk memberikan pengalaman audio berkualitas tinggi yang kaya.
  Menghadirkan Cider Adrenaline, Atmosphere Realizer, dan Spatialized Audio.
