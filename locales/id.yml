mobile.playback.drm.revokedMessage: Apple Music melindungi lagunya dengan Widevine, dan Widevine tidak lagi mempercayai perangkat ini. Biasanya ini terjadi setelah perubahan pada perangkat lunaknya, seperti bootloader yang dibuka. Anda tetap bisa menelusuri, mencari, mengelola pustaka, dan membaca lirik.
mobile.playback.drm.setupFailedMessage: Sebelum memutar Apple Music untuk pertama kali, perangkat ini harus menyiapkan Widevine, fitur keamanan yang melindungi lagu-lagunya. Penyiapan itu belum selesai. Periksa koneksi Anda dan coba lagi.
