mobile.playback.drm.brokenMessage: Widevine, fitur keamanan yang digunakan Apple Music untuk melindungi lagunya, melaporkan kesalahan di perangkat ini. Memulai ulang perangkat sering kali memperbaikinya. Anda tetap bisa menelusuri, mencari, mengelola pustaka, dan membaca lirik.
