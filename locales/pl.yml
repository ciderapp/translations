settings.troubleshooting.bgDiagnostics.desc: Dodatkowe ślady w logach ułatwiające diagnozowanie problemów z odtwarzaniem, gdy okno jest zminimalizowane lub nieaktywne — np. kto wstrzymał odtwarzacz, dławienie timera i wstrzymanie przez system operacyjny. Włącz tę opcję podczas zgłaszania błędu odtwarzania w tle.
settings.troubleshooting.desc: Pliki dziennika i debugowanie MKLite.
settings.troubleshooting.hevcWorkaround: Obejście problemu z HEVC
settings.troubleshooting.hevcWorkaround.desc: Obejście błędu w WebView2 występującego na niektórych procesorach graficznych mających problemy z odtwarzaniem 10-bitowego wideo SDR HEVC, polegające na zastosowaniu filtra kompensującego przesunięcie wizualne.
settings.troubleshooting.impressionReporting: Raportowanie wyświetleń PlayActivity
settings.troubleshooting.impressionReporting.warning1: Wysyła telemetrię wyświetleń półek i kliknięć do xp.apple.com/report/2/xp_its_music_main, dopasowując ją do danych wysyłanych przez odtwarzacz sieciowy music.apple.com. Pozwala to silnikowi rekomendacji Apple przypisać odtworzenia do konkretnej rekomendacji, która je wywołała – są to te same dane, co w naszym polu reco-data PlayActivity, ale pochodzące również ze strony wyświetleń.
settings.troubleshooting.impressionReporting.warning2: Są to rzeczywiste wychodzące dane telemetryczne do Apple, wykraczające poza strumień PlayActivity, który Cider już wysyła. Włącz tę opcję tylko wtedy, gdy chcesz uzyskać pełną spójność personalizacji z music.apple.com.
settings.troubleshooting.logFile: Plik dziennika
settings.troubleshooting.logFile.actions: Działania na pliku dziennika
settings.troubleshooting.logFile.desc: Wyświetlaj, kopiuj lub czyść plik dziennika
settings.troubleshooting.mkliteDebug: Rejestrowanie debugowania MKLite
settings.troubleshooting.mkliteDebug.desc: Szczegółowe dane wyjściowe konsoli z MKLite — ładunki PlayActivity (JSPLAY), zmiany utworów i stan odtwarzania. Przydatne przy porównywaniu danych wysyłanych do Apple z music.apple.com. Wyłącz do normalnego użytku.
settings.troubleshooting.mkLoadingMethod: Metoda ładowania MusicKit
settings.troubleshooting.mkLoadingMethod.warning1: Zmień metodę ładowania MusicKit. Służy to do rozwiązywania potencjalnych problemów z ładowaniem po aktualizacjach MusicKit.
settings.troubleshooting.mkLoadingMethod.warning2: To ustawienie NIE powinno być zmieniane, chyba że wiesz, co robisz, lub otrzymasz takie polecenie.
settings.troubleshooting.mkLoadingMethod.warning3: Ta opcja nie służy do rozwiązywania ogólnych problemów z połączeniem lub odtwarzaniem.
settings.troubleshooting.rebootMk: Uruchom ponownie MusicKit
settings.troubleshooting.rebootMk.desc: Uruchom ponownie MusicKit, aby naprawić problemy z odtwarzaniem
settings.troubleshooting.testSignIn: Test logowania do Apple Music
settings.troubleshooting.testSignIn.desc: Uruchom wyskakujące okno logowania Apple Music, aby sprawdzić, czy logowanie działa, a następnie zweryfikuj token w API. Nic nie zostanie zapisane, a Twoja obecna sesja pozostanie nienaruszona.
