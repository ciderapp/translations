mobile.playback.drm.brokenMessage: Widevine, funkcja zabezpieczeń, z której Apple Music korzysta do ochrony utworów, zgłosiła błąd na tym urządzeniu. Ponowne uruchomienie urządzenia często to naprawia. Nadal możesz przeglądać, wyszukiwać, zarządzać biblioteką i czytać teksty.
