mobile.playback.drm.cantPlayTitle: To urządzenie nie może odtwarzać Apple Music
mobile.playback.drm.revokedMessage: Apple Music chroni utwory za pomocą Widevine, a Widevine nie ufa już temu urządzeniu. Zwykle dzieje się tak po zmianie oprogramowania, na przykład po odblokowaniu bootloadera. Nadal możesz przeglądać, wyszukiwać, zarządzać biblioteką i czytać teksty.
mobile.playback.drm.setupFailedMessage: Zanim po raz pierwszy odtworzy Apple Music, to urządzenie musi skonfigurować Widevine, funkcję zabezpieczeń chroniącą utwory. Konfiguracja się nie powiodła. Sprawdź połączenie i spróbuj ponownie.
mobile.playback.drm.setupFailedShort: Nie udało się skonfigurować odtwarzania chronionych treści. Spróbuj ponownie
mobile.playback.drm.setupFailedTitle: Nie udało się skonfigurować odtwarzania chronionych treści
mobile.playback.drm.unsupportedMessage: Apple Music chroni utwory za pomocą Widevine, funkcji zabezpieczeń wbudowanej w większość urządzeń z Androidem. Tego urządzenia nie ma, dlatego utwory nie mogą tu być odtwarzane. Nadal możesz przeglądać, wyszukiwać, zarządzać biblioteką i czytać teksty.
mobile.playback.explicitOffMessage: Apple Music nie odtwarza utworów z treściami explicit na tym koncie Apple, dlatego Cider je pomija. Wynika to z ograniczeń treści na koncie, np. Czasu przed ekranem na iPhonie, iPadzie lub Macu, konta dziecka w Udostępnianiu w rodzinie albo weryfikacji wieku, jeśli wymaga tego Twój kraj. Wersje ocenzurowane nadal się odtwarzają.
