  value: |-
    Cider býður upp á sérsniðið og fínstillt hljóðkerfi sem skilar ríkulegri hágæða hljóðupplifun.
    Þar má nefna Cider Adrenaline, Atmosphere Realizer og Spatialized Audio.
    Til að virkja þessa virkni þarf að kveikja á „Advanced Audio Functionality“.
    Þegar Advanced Audio Functionality er virkjuð færðu aðgang að þessum viðbótum í Cider Audio Labs, sem finna má í stillingum forritsins.
