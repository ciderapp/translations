oobe.subscriptionNote: Cider krefst virkrar, greiddrar áskriftar að Apple Music. Apple Music Voice og sumar kynningarprufur eru ekki studdar.
oobe.visual.layout.text:
  value: |-
    Cider býður upp á tvær mismunandi gluggauppsetningar.
    Maverick er uppsetning í líkingu við iTunes þar sem spilarinn er efst í glugganum.
