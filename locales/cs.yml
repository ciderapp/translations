mobile.playback.drm.setupFailedTitle: Chráněné přehrávání se nepodařilo nastavit
mobile.playback.drm.unsupportedMessage: Apple Music chrání své skladby pomocí Widevine, bezpečnostní funkce zabudované do většiny zařízení s Androidem. Toto zařízení ji nemá, takže zde skladby nelze přehrát. Stále můžete procházet, vyhledávat, spravovat knihovnu a číst texty.
mobile.playback.explicitOffMessage: Apple Music u tohoto Apple účtu nepřehrává explicitní skladby, takže je Cider přeskakuje. Důvodem jsou omezení obsahu účtu, například Čas u daleko iPhonu, iPadu nebo Macu, dětský účet ve Sdílení v rodině nebo ověření věku, pokud to vaše země vyžaduje. Verze bez explicitního obsahu se přehrají.
