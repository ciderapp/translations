mobile.playback.drm.revokedMessage: Apple Music chrání své skladby pomocí Widevine a Widevine tomuto zařízení already nedůvěřuje. Obvykle to nastane po změně softwaru, například po odemknutí bootloaderu. Stále můžete procházet, vyhledávat, spravovat knihovnu a číst texty.
mobile.playback.drm.setupFailedMessage: Než tohle zařízení poprvé přehraje Apple Music, musí nastavit Widevine, bezpečnostní funkci, která skladby chrání. Nastavení se nedokončilo. Zkontrolujte připojení a zkuste to znovu.
