mobile.playback.drm.brokenMessage: Widevine, la fonctionnalité de sécurité qu’Apple Music utilise pour protéger ses chansons, a signalé une erreur sur cet appareil. Redémarrer l’appareil règle souvent le problème. Vous pouvez toujours parcourir, rechercher, gérer votre bibliothèque et lire les paroles.
mobile.playback.drm.brokenShort: La lecture protégée ne fonctionne pas sur cet appareil
mobile.playback.drm.brokenTitle: La lecture protégée ne fonctionne pas
mobile.playback.drm.cantPlayShort: Cet appareil ne peut pas lire les chansons d’Apple Music
mobile.playback.drm.cantPlayTitle: Cet appareil ne peut pas lire Apple Music
mobile.playback.drm.revokedMessage: Apple Music protège ses chansons avec Widevine, et Widevine ne fait plus confiance à cet appareil. Cela suit généralement une modification de son logiciel, comme un chargeur de démarrage déverrouillé. Vous pouvez toujours parcourir, rechercher, gérer votre bibliothèque et lire les paroles.
mobile.playback.drm.setupFailedMessage: Avant de lire Apple Music pour la première fois, cet appareil doit configurer Widevine, la fonctionnalité de sécurité qui protège les chansons. Cette configuration ne s’est pas terminée. Vérifiez votre connexion et réessayez.
mobile.playback.drm.setupFailedShort: Impossible de configurer la lecture protégée. Réessayez
mobile.playback.drm.setupFailedTitle: Impossible de configurer la lecture protégée
mobile.playback.drm.unsupportedMessage: Apple Music protège ses chansons avec Widevine, une fonctionnalité de sécurité intégrée à la plupart des appareils Android. Cet appareil ne l’a pas, donc les chansons ne peuvent pas être lues ici. Vous pouvez toujours parcourir, rechercher, gérer votre bibliothèque et lire les paroles.
mobile.playback.explicitOffMessage: Apple Music ne lit pas les chansons explicites pour cet identifiant Apple, donc Cider les ignore. Cela provient des restrictions de contenu du compte, comme le Temps d’écran sur un iPhone, un iPad ou un Mac, un compte enfant dans le Partage familial, ou la vérification de l’âge lorsque votre pays l’exige. Les versions épurées sont toujours lues.
