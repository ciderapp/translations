mobile.playback.drm.brokenMessage: O Widevine, a funcionalidade de segurança que o Apple Music usa para proteger as suas músicas, comunicou um erro neste dispositivo. Reiniciar o dispositivo costuma resolver. Pode continuar a navegar, pesquisar, gerir a sua biblioteca e ler as letras.
mobile.playback.drm.brokenShort: A reprodução protegida não funciona neste dispositivo
mobile.playback.drm.brokenTitle: A reprodução protegida não funciona
mobile.playback.drm.cantPlayShort: Este dispositivo não consegue reproduzir músicas do Apple Music
mobile.playback.drm.cantPlayTitle: Este dispositivo não consegue reproduzir o Apple Music
mobile.playback.drm.revokedMessage: O Apple Music protege as suas músicas com o Widevine, e o Widevine deixou de confiar neste dispositivo. Isto costuma acontecer após uma alteração ao software, como um bootloader desbloqueado. Pode continuar a navegar, pesquisar, gerir a sua biblioteca e ler as letras.
mobile.playback.drm.setupFailedMessage: Antes de reproduzir o Apple Music pela primeira vez, este dispositivo tem de configurar o Widevine, a funcionalidade de segurança que protege as músicas. Essa configuração não foi concluída. Verifique a sua ligação e tente novamente.
mobile.playback.drm.setupFailedShort: Não foi possível configurar a reprodução protegida. Tente novamente
mobile.playback.drm.setupFailedTitle: Não foi possível configurar a reprodução protegida
mobile.playback.drm.unsupportedMessage: O Apple Music protege as suas músicas com o Widevine, uma funcionalidade de segurança incluída na maioria dos dispositivos Android. Este dispositivo não a tem, por isso as músicas não podem ser reproduzidas aqui. Pode continuar a navegar, pesquisar, gerir a sua biblioteca e ler as letras.
mobile.playback.explicitOffMessage: O Apple Music não reproduz músicas explícitas nesta conta Apple, por isso o Cider as ignora. Isto resulta das restrições de conteúdo da conta, como o Tempo de Ecrã num iPhone, iPad ou Mac, uma conta infantil na Partilha Familiar, ou a verificação de idade, quando o seu país a exige. As versões editadas continuam a ser reproduzidas.
mobile.playback.explicitOffTitle: As músicas explícitas estão desativadas nesta conta
mobile.playback.explicitSkipped: Música explícita ignorada
