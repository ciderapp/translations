mobile.playback.drm.revokedMessage: Apple Music schützt seine Songs mit Widevine, und Widevine vertraut diesem Gerät nicht mehr. Das folgt meist auf eine Änderung der Software, etwa einen entsperrten Bootloader. Du kannst weiterhin stöbern, suchen, deine Mediathek verwalten und Liedtexte lesen.
mobile.playback.drm.setupFailedMessage: Bevor dieses Gerät Apple Music zum ersten Mal abspielt, muss es Widevine einrichten, die Sicherheitsfunktion, die die Songs schützt. Diese Einrichtung wurde nicht abgeschlossen. Prüfe deine Verbindung und versuche es erneut.
mobile.playback.drm.setupFailedShort: Geschützte Wiedergabe konnte nicht eingerichtet werden. Erneut versuchen
mobile.playback.drm.setupFailedTitle: Geschützte Wiedergabe konnte nicht eingerichtet werden
mobile.playback.drm.unsupportedMessage: Apple Music schützt seine Songs mit Widevine, einer Sicherheitsfunktion, die in den meisten Android-Geräten integriert ist. Dieses Gerät hat sie nicht, daher können hier keine Songs abgespielt werden. Du kannst weiterhin stöbern, suchen, deine Mediathek verwalten und Liedtexte lesen.
mobile.playback.explicitOffMessage: Apple Music spielt für diese Apple-Account keine expliziten Songs ab, daher überspringt Cider sie. Das liegt an den Inhaltsbeschränkungen des Kontos, etwa der Bildschirmzeit auf einem iPhone, iPad oder Mac, einem Kinderkonto in der Familienfreigabe oder einer Altersprüfung, wo dein Land sie vorschreibt. Bereinigte Versionen werden weiterhin abgespielt.
