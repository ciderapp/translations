mobile.playback.drm.unsupportedMessage: O Apple Music protege suas músicas com o Widevine, um recurso de segurança presente na maioria dos dispositivos Android. Este dispositivo não o possui, então as músicas não podem ser reproduzidas aqui. Você ainda pode navegar, pesquisar, gerenciar sua biblioteca e ler letras.
mobile.playback.explicitOffMessage: O Apple Music não reproduz músicas explícitas com este ID Apple, então o Cider as pula. Isso vem das restrições de conteúdo da conta, como o Tempo de Uso em iPhone, iPad ou Mac, uma conta infantil no Compartilhamento Familiar ou a verificação de idade exigida no seu país. Versões censuradas continuam sendo reproduzidas.
