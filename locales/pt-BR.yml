mobile.playback.drm.revokedMessage: O Apple Music protege suas músicas com o Widevine, e o Widevine não confia mais neste dispositivo. Isso geralmente acontece após uma alteração no software, como um bootloader desbloqueado. Você ainda pode navegar, pesquisar, gerenciar sua biblioteca e ler letras.
mobile.playback.drm.setupFailedMessage: Antes de reproduzir o Apple Music pela primeira vez, este dispositivo precisa configurar o Widevine, o recurso de segurança que protege as músicas. A configuração não foi concluída. Verifique sua conexão e tente novamente.
